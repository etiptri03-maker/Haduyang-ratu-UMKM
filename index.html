      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Semua Kategori');
      const [priceFilter, setPriceFilter] = useState('all'); // 'all', 'under20', '20to50', 'above50'
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [buyerTab, setBuyerTab] = useState('catalog'); // 'catalog' | 'orders'
      const [sellerTab, setSellerTab] = useState('orders'); // 'orders' | 'products'
      const [adminTab, setAdminTab] = useState('overview'); // 'overview' | 'orders' | 'moderation' | 'audit'
      
      // Modals
      const [activeProductDetail, setActiveProductDetail] = useState(null);
      const [isAddProductModalOpen, setIsAddProductModalOpen] = useState(false);
      const [rejectModalOrder, setRejectModalOrder] = useState(null);
      const [rejectReason, setRejectReason] = useState('');
      const [printPreviewOrder, setPrintPreviewOrder] = useState(null);

      // Toast feedback
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Save to LocalStorage
      useEffect(() => {
        localStorage.setItem('hdr_role', role);
      }, [role]);
      useEffect(() => {
        localStorage.setItem('hdr_products', JSON.stringify(products));
      }, [products]);
      useEffect(() => {
        localStorage.setItem('hdr_sellers', JSON.stringify(sellers));
      }, [sellers]);
      useEffect(() => {
        localStorage.setItem('hdr_orders', JSON.stringify(orders));
      }, [orders]);
      useEffect(() => {
        localStorage.setItem('hdr_audit', JSON.stringify(auditLogs));
      }, [auditLogs]);
      useEffect(() => {
        localStorage.setItem('hdr_cart', JSON.stringify(cart));
      }, [cart]);

      // Reset data
      const handleResetData = () => {
        if (window.confirm('Kembalikan semua data ke setelan awal pabrik (seed data)?')) {
          setProducts(INITIAL_PRODUCTS);
          setSellers(INITIAL_SELLERS);
          setOrders(INITIAL_ORDERS);
          setAuditLogs(INITIAL_AUDIT_LOGS);
          setCart([]);
          localStorage.clear();
          showToast('Data berhasil di-reset ke setelan awal!', 'info');
        }
      };

      // Log action helper
      const logAction = (actor, action) => {
        const newLog = {
          id: 'log-' + Date.now(),
          timestamp: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          actor,
          action
        };
        setAuditLogs(prev => [newLog, ...prev]);
      };

      // Cart count
      const totalCartCount = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.quantity, 0);
      }, [cart]);

      // Cart subtotal
      const cartSubtotal = useMemo(() => {
        return cart.reduce((sum, item) => {
          const prod = products.find(p => p.id === item.productId);
          return sum + (prod ? prod.price * item.quantity : 0);
        }, 0);
      }, [cart, products]);

      // Add to Cart
      const handleAddToCart = (product, qty = 1) => {
        if (product.stock <= 0) {
          showToast('Maaf, stok produk sedang habis.', 'error');
          return;
        }
        setCart(prev => {
          const existing = prev.find(item => item.productId === product.id);
          const currentQty = existing ? existing.quantity : 0;
          if (currentQty + qty > product.stock) {
            showToast(`Maksimal pesanan sesuai stok yang tersedia: ${product.stock} ${product.unit}`, 'error');
            return prev;
          }
          if (existing) {
            return prev.map(item => item.productId === product.id ? { ...item, quantity: item.quantity + qty } : item);
          }
          return [...prev, { productId: product.id, quantity: qty }];
        });
        showToast(`${product.name} dimasukkan ke keranjang`);
      };

      const handleUpdateCartQty = (productId, delta) => {
        const prod = products.find(p => p.id === productId);
        setCart(prev => {
          return prev.map(item => {
            if (item.productId === productId) {
              const newQty = item.quantity + delta;
              if (newQty <= 0) return null;
              if (prod && newQty > prod.stock) {
                showToast(`Stok hanya tersedia ${prod.stock} ${prod.unit}`, 'error');
                return item;
              }
              return { ...item, quantity: newQty };
            }
            return item;
          }).filter(Boolean);
        });
      };

      const handleRemoveFromCart = (productId) => {
        setCart(prev => prev.filter(i => i.productId !== productId));
        showToast('Item dihapus dari keranjang', 'info');
      };

      // Checkout
      const handleCheckout = (fulfillmentMethod, deliveryAddress, notes) => {
        if (cart.length === 0) return;

        // Verify stock availability
        for (let item of cart) {
          const prod = products.find(p => p.id === item.productId);
          if (!prod || prod.stock < item.quantity) {
            showToast(`Gagal: Stok untuk ${prod ? prod.name : 'produk'} tidak mencukupi!`, 'error');
            return;
          }
        }

        const dateStr = new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        const orderId = `HDR-${new Date().getFullYear()}${String(new Date().getMonth()+1).padStart(2,'0')}${String(new Date().getDate()).padStart(2,'0')}-${Math.floor(100 + Math.random() * 900)}`;

        const orderItems = cart.map(item => {
          const prod = products.find(p => p.id === item.productId);
          return {
            productId: prod.id,
            sellerId: prod.sellerId,
            productNameSnapshot: prod.name,
            unitPriceSnapshot: prod.price,
            quantity: item.quantity,
            unit: prod.unit,
            lineTotal: prod.price * item.quantity
          };
        });

        const newOrder = {
          id: orderId,
          buyerName: 'Ibu Rina',
          buyerPhone: '0813-8899-0011',
          status: 'pending',
          subtotal: cartSubtotal,
          deliveryFee: 0,
          totalAmount: cartSubtotal,
          fulfillmentMethod,
          deliveryAddress: fulfillmentMethod === 'delivery' ? deliveryAddress : 'Ambil di Toko Penjual Haduyang Ratu',
          notes: notes || '-',
          date: dateStr,
          items: orderItems
        };

        // Deduct product stocks
        setProducts(prev => prev.map(p => {
          const cartItem = cart.find(ci => ci.productId === p.id);
          if (cartItem) {
            return { ...p, stock: Math.max(0, p.stock - cartItem.quantity) };
          }
          return p;
        }));

        setOrders(prev => [newOrder, ...prev]);
        setCart([]);
        setIsCartOpen(false);
        logAction('Ibu Rina (Pembeli)', `Membuat pesanan baru ${orderId} senilai ${formatRp(cartSubtotal)}`);
        showToast(`Pesanan ${orderId} berhasil dikirim! Menunggu konfirmasi penjual.`);
        setBuyerTab('orders');
      };

      // Seller update order status
      const handleUpdateOrderStatus = (orderId, newStatus, reason = '') => {
        setOrders(prev => prev.map(ord => {
          if (ord.id === orderId) {
            // If rejected or cancelled, restore product stock
            if ((newStatus === 'rejected' || newStatus === 'cancelled') && ord.status !== 'rejected' && ord.status !== 'cancelled') {
              setProducts(currProds => currProds.map(p => {
                const item = ord.items.find(i => i.productId === p.id);
                if (item) {
                  return { ...p, stock: p.stock + item.quantity };
                }
                return p;
              }));
            }
            return {
              ...ord,
              status: newStatus,
              rejectReason: reason || ord.rejectReason
            };
          }
          return ord;
        }));

        const statusLabel = {
          processing: 'Dikonfirmasi & Diproses',
          ready: 'Siap Diambil/Dikirim',
          completed: 'Selesai',
          rejected: 'Ditolak',
          cancelled: 'Dibatalkan'
        }[newStatus] || newStatus;

        logAction(role === 'seller' ? 'Pak Arif (Penjual)' : 'Admin BUMDes', `Mengubah status pesanan ${orderId} menjadi: ${statusLabel}`);
        showToast(`Pesanan ${orderId} diperbarui: ${statusLabel}`);
      };

      // Seller add new product
      const handleAddNewProduct = (newProdData) => {
        const newProduct = {
          id: 'p-' + Date.now(),
          sellerId: 'seller-1', // Pak Arif
          status: 'active',
          ...newProdData
        };
        setProducts(prev => [newProduct, ...prev]);
        logAction('Pak Arif (Penjual)', `Menambahkan produk baru: ${newProduct.name} (${formatRp(newProduct.price)}/${newProduct.unit})`);
        setIsAddProductModalOpen(false);
        showToast('Produk baru berhasil dipublikasikan!');
      };

      // Seller update quick stock
      const handleQuickStock = (productId, newStock) => {
        const validStock = Math.max(0, parseInt(newStock) || 0);
        setProducts(prev => prev.map(p => p.id === productId ? { ...p, stock: validStock } : p));
        showToast('Stok diperbarui', 'info');
      };

      // Seller toggle active
      const handleToggleProductStatus = (productId) => {
        setProducts(prev => prev.map(p => {
          if (p.id === productId) {
            const nextStatus = p.status === 'active' ? 'inactive' : 'active';
            logAction(role === 'admin' ? 'Admin BUMDes' : 'Pak Arif (Penjual)', `Mengubah status produk ${p.name} menjadi ${nextStatus}`);
            return { ...p, status: nextStatus };
          }
          return p;
        }));
        showToast('Status tayang produk diperbarui');
      };

      // Admin Export to CSV
      const handleExportCSV = () => {
        const headers = ['Nomor_Pesanan', 'Tanggal', 'Nama_Pembeli', 'Metode', 'Total_Rp', 'Status', 'Alamat_Pengiriman', 'Item_Barang'];
        const rows = orders.map(o => {
          const itemsStr = o.items.map(i => `${i.productNameSnapshot} (${i.quantity} ${i.unit})`).join('; ');
          return [
            o.id,
            `"${o.date}"`,
            `"${o.buyerName}"`,
            o.fulfillmentMethod === 'delivery' ? 'Antar Desa' : 'Ambil di Toko',
            o.totalAmount,
            o.status,
            `"${(o.deliveryAddress || '').replace(/"/g, '""')}"`,
            `"${itemsStr.replace(/"/g, '""')}"`
          ].join(',');
        });

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `Laporan_Transaksi_Haduyang_Ratu_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        logAction('Admin BUMDes', 'Mengekspor laporan transaksi format CSV');
        showToast('Laporan CSV berhasil diunduh!');
      };

      // Filtered products for Buyer catalog
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          // If inactive and not admin, hide
          if (p.status !== 'active') return false;

          const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              p.description.toLowerCase().includes(searchQuery.toLowerCase());
          const matchCategory = selectedCategory === 'Semua Kategori' || p.category === selectedCategory;

          let matchPrice = true;
          if (priceFilter === 'under20') matchPrice = p.price < 20000;
          else if (priceFilter === '20to50') matchPrice = p.price >= 20000 && p.price <= 50000;
          else if (priceFilter === 'above50') matchPrice = p.price > 50000;

          return matchSearch && matchCategory && matchPrice;
        });
      }, [products, searchQuery, selectedCategory, priceFilter]);

      // Seller Pak Arif orders
      const pakArifOrders = useMemo(() => {
        return orders.filter(o => o.items.some(i => i.sellerId === 'seller-1'));
      }, [orders]);

      // Admin metrics
      const adminMetrics = useMemo(() => {
        const completed = orders.filter(o => o.status === 'completed');
        const gmv = completed.reduce((sum, o) => sum + o.totalAmount, 0);
        const activeProds = products.filter(p => p.status === 'active').length;
        const pendingCount = orders.filter(o => o.status === 'pending').length;
        return {
          gmv,
          completedCount: completed.length,
          totalOrders: orders.length,
          activeProds,
          pendingCount,
          totalSellers: sellers.length
        };
      }, [orders, products, sellers]);

      return (
        <div className="min-h-screen flex flex-col bg-[#FBFBF9]">
          
          {/* TOAST ALERT */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-xl border bg-white text-slate-800 border-slate-200 transition-all transform duration-300">
              <span className={`w-3 h-3 rounded-full ${toast.type === 'error' ? 'bg-rose-500' : toast.type === 'info' ? 'bg-blue-500' : 'bg-emerald-500'}`} />
              <p className="text-sm font-semibold">{toast.message}</p>
            </div>
          )}

          {/* SIMULATION NOTICE BANNER */}
          <div className="bg-amber-100 border-b border-amber-200 text-amber-900 px-4 py-2 text-xs md:text-sm font-medium flex items-center justify-between">
            <div className="flex items-center gap-2 mx-auto">
              <span className="bg-amber-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase">Mode Pengujian MVP</span>
              <span>Transaksi & pembayaran disimulasikan secara tunai/COD saat barang diterima sesuai ketentuan PRD BUMDes.</span>
            </div>
          </div>

          {/* TOP NAVBAR */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm transition">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              
              {/* BRAND LOGO */}
              <div className="flex items-center gap-3">

                  <Icon name="store" className="w-6 h-6" />

                  <div className="flex items-center gap-2">
                    <h1 className="font-extrabold text-lg sm:text-xl text-slate-900 tracking-tight">Haduyang Ratu Market</h1>
                    <span className="hidden sm:inline-block bg-emerald-100 text-emerald-800 text-[11px] font-bold px-2 py-0.5 rounded-full border border-emerald-300">
                      BUMDes Digital
                    </span>
                  </div>
                  <p className="text-xs text-slate-500">Pasar Komoditas & UMKM Desa Haduyang Ratu, Lampung Utara</p>
                </div>

              {/* ROLE-SPECIFIC NAVIGATION ACTIONS */}
              <div className="flex items-center gap-3">
                {role === 'buyer' && (
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setBuyerTab('catalog')}
                      className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 ${buyerTab === 'catalog' ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}
                    >
                      <Icon name="store" className="w-4 h-4" />
                      <span>Katalog Desa</span>
                    </button>
                    <button
                      onClick={() => setBuyerTab('orders')}
                      className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 ${buyerTab === 'orders' ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}
                    >
                      <Icon name="clock" className="w-4 h-4" />
                      <span>Pesanan Saya</span>
                    </button>
                    <button
                      onClick={() => setIsCartOpen(true)}
                      className="relative p-2.5 rounded-xl bg-emerald-50 text-emerald-800 hover:bg-emerald-100 border border-emerald-200 transition"
                      title="Keranjang Belanja"
                    >
                      <Icon name="cart" className="w-5 h-5" />
                      {totalCartCount > 0 && (
                        <span className="absolute -top-1.5 -right-1.5 bg-amber-600 text-white font-extrabold text-[11px] w-5 h-5 rounded-full flex items-center justify-center shadow">
                          {totalCartCount}
                        </span>
                      )}
                    </button>
                  </div>

                {role === 'seller' && (
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setSellerTab('orders')}
                      className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 ${sellerTab === 'orders' ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}
                    >
                      <Icon name="package" className="w-4 h-4" />
                      <span>Pesanan Kebun</span>
                      {pakArifOrders.filter(o => o.status === 'pending').length > 0 && (
                        <span className="bg-amber-400 text-slate-950 px-1.5 py-0.2 rounded-full text-xs font-black">
                          {pakArifOrders.filter(o => o.status === 'pending').length}

                    </button>
                    <button

                      className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 ${sellerTab === 'products' ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}
                    >
                      <Icon name="store" className="w-4 h-4" />
                      <span>Produk Toko</span>
                    </button>
                  </div>
                )}

                {role === 'admin' && (
                  <div className="flex items-center gap-1 sm:gap-2">
                    <button
                      onClick={() => setAdminTab('overview')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${adminTab === 'overview' ? 'bg-emerald-800 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                    >
                      Ringkasan
                    </button>
                    <button
                      onClick={() => setAdminTab('orders')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${adminTab === 'orders' ? 'bg-emerald-800 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                    >
                      Transaksi
                    </button>
                    <button
                      onClick={() => setAdminTab('moderation')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${adminTab === 'moderation' ? 'bg-emerald-800 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                    >
                      Moderasi
                    </button>
                    <button
                      onClick={() => setAdminTab('audit')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${adminTab === 'audit' ? 'bg-emerald-800 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                    >
                      Audit Log
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

            {/* ======================================================== */}
            {/* VIEW 1: PEMBELI (BUYER VIEW)                            */}
            {/* ======================================================== */}
            {role === 'buyer' && buyerTab === 'catalog' && (
              <div className="space-y-8">
                
                {/* HERO BANNER */}
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-emerald-900 via-emerald-800 to-emerald-950 text-white p-6 sm:p-10 shadow-xl border border-emerald-700/40">
                  <div className="relative z-10 max-w-2xl space-y-3">

              <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl space-y-4">
                <div className="relative aspect-video">
                  <img src={activeProductDetail.image} alt="" className="w-full h-full object-cover" />
                  <button
                    onClick={() => setActiveProductDetail(null)}
                    className="absolute top-3 right-3 bg-white/90 p-1.5 rounded-full text-slate-700 hover:bg-white"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-6 space-y-4">
                  <div>
                    <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full">
                      {activeProductDetail.category}
                    </span>
                    <h3 className="text-xl font-black text-slate-900 mt-2">{activeProductDetail.name}</h3>
                    <p className="text-2xl font-black text-emerald-800 mt-1">
                      {formatRp(activeProductDetail.price)} <span className="text-sm font-semibold text-slate-400">/ {activeProductDetail.unit}</span>
                    </p>
                  </div>

                  <p className="text-xs text-slate-600 leading-relaxed">
                    {activeProductDetail.description}
                  </p>

                  {/* Seller Profile info */}
                  {(() => {
                    const sel = sellers.find(s => s.id === activeProductDetail.sellerId);
                    if (!sel) return null;
                    return (
                      <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-xs space-y-1">
                        <span className="font-extrabold text-slate-900 flex items-center gap-1.5">
                          <Icon name="store" className="w-4 h-4 text-emerald-700" />
                          {sel.storeName}
                        </span>
                        <p className="text-slate-500">Pemilik: {sel.ownerName} ({sel.dusun})</p>
                        <p className="text-slate-500">Alamat: {sel.address}</p>
                        <p className="text-slate-500">Nomor HP/WA: {sel.phone}</p>
                      </div>
                    );
                  })()}

                  <div className="pt-2 flex items-center gap-3">
                    <button
                      onClick={() => setActiveProductDetail(null)}
                      className="flex-1 py-2.5 rounded-xl border border-slate-300 text-xs font-bold text-slate-700"
                    >
                      Tutup
                    </button>
                    <button
                      onClick={() => {
                        handleAddToCart(activeProductDetail, 1);
                        setActiveProductDetail(null);
                      }}
                      disabled={activeProductDetail.stock <= 0}
                      className="flex-1 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold shadow transition"
                    >
                      + Tambah Keranjang
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: TAMBAH PRODUK BARU (FOR SELLER)                   */}
          {/* ======================================================== */}
          {isAddProductModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-black text-lg text-slate-900">Tambah Komoditas Baru</h3>
                  <button onClick={() => setIsAddProductModalOpen(false)} className="text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    handleAddNewProduct({
                      name: fd.get('name'),
                      category: fd.get('category'),
                      price: parseInt(fd.get('price')),
                      unit: fd.get('unit'),
                      stock: parseInt(fd.get('stock')),
                      image: fd.get('image') || 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80',
                      description: fd.get('description'),
                    });
                  }}
                  className="space-y-3 text-xs"
                >
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Nama Produk / Komoditas</label>
                    <input required name="name" placeholder="Misal: Pepaya California Haduyang" className="w-full p-2.5 rounded-xl border border-slate-300" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Kategori</label>
                      <select name="category" className="w-full p-2.5 rounded-xl border border-slate-300 bg-white">
                        <option>Hasil Pertanian</option>
                        <option>Sayuran Segar</option>
                        <option>Makanan Olahan Desa</option>
                        <option>Produk Kerajinan & UMKM</option>
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Satuan</label>
                      <input required name="unit" placeholder="kg / ikat / pcs" defaultValue="kg" className="w-full p-2.5 rounded-xl border border-slate-300" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Harga (Rp)</label>
                      <input required type="number" min="500" name="price" placeholder="15000" className="w-full p-2.5 rounded-xl border border-slate-300" />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Stok Awal</label>
                      <input required type="number" min="1" name="stock" placeholder="20" className="w-full p-2.5 rounded-xl border border-slate-300" />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">URL Foto Produk</label>
                    <input name="image" placeholder="https://images.unsplash.com/..." className="w-full p-2.5 rounded-xl border border-slate-300" />
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Deskripsi Singkat</label>
                    <textarea required name="description" rows="2" placeholder="Jelaskan kualitas panen, rasa, atau keunggulannya..." className="w-full p-2.5 rounded-xl border border-slate-300" />
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsAddProductModalOpen(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 font-bold"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold"
                    >
                      Publikasikan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: ALASAN PENOLAKAN PESANAN (FR-05 & FR-06)          */}
          {/* ======================================================== */}
          {rejectModalOrder && (
            <div className="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                <h3 className="font-black text-base text-slate-900">Alasan Menolak Pesanan {rejectModalOrder.id}</h3>
                <p className="text-xs text-slate-500">Sesuai PRD, penolakan pesanan wajib menyertakan alasan yang transparan bagi pembeli.</p>
                <textarea
                  value={rejectReason}
                  onChange={(e) => setRejectReason(e.target.value)}
                  placeholder="Contoh: Stok di kebun rusak terkena hujan deras semalam..."
                  rows="3"
                  className="w-full text-xs p-3 rounded-xl border border-slate-300 focus:ring-1 focus:ring-rose-500"
                />
                <div className="flex justify-end gap-2 text-xs">
                  <button onClick={() => setRejectModalOrder(null)} className="px-3 py-2 rounded-xl border font-bold">
                    Batal
                  </button>
                  <button
                    onClick={() => {
                      if (!rejectReason.trim()) {
                        alert('Mohon tuliskan alasan penolakan.');
                        return;
                      }
                      handleUpdateOrderStatus(rejectModalOrder.id, 'rejected', rejectReason);
                      setRejectModalOrder(null);
                    }}
                    className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold"
                  >
                    Tolak Pesanan
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: PRINT PREVIEW STRUK TRANSAKSI (FOR ADMIN/SELLER)  */}
          {/* ======================================================== */}
          {printPreviewOrder && (
            <div className="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 font-mono text-xs">
                <div className="text-center border-b pb-3 space-y-1">
                  <h4 className="font-black text-sm uppercase">BUMDes Haduyang Ratu</h4>
                  <p className="text-[11px] text-slate-500">Pasar Digital Komoditas & UMKM Desa</p>
                  <p className="text-[10px] text-slate-400">Haduyang Ratu, Lampung Utara</p>
                </div>
                <div className="space-y-1 text-slate-600">
                  <div className="flex justify-between"><span>No. Transaksi</span><strong className="text-slate-900">{printPreviewOrder.id}</strong></div>
                  <div className="flex justify-between"><span>Waktu</span><span>{printPreviewOrder.date}</span></div>
                  <div className="flex justify-between"><span>Pembeli</span><span>{printPreviewOrder.buyerName}</span></div>
                  <div className="flex justify-between"><span>Metode</span><span>{printPreviewOrder.fulfillmentMethod === 'delivery' ? 'Antar Desa' : 'Ambil Mandiri'}</span></div>
                </div>
                <div className="border-t border-b py-2 space-y-1">
                  {printPreviewOrder.items.map((i, idx) => (
                    <div key={idx} className="flex justify-between">
                      <span>{i.productNameSnapshot} x{i.quantity}</span>
                      <span>{formatRp(i.lineTotal)}</span>
                    </div>
                  ))}
                </div>
                <div className="flex justify-between font-bold text-sm text-slate-900">
                  <span>TOTAL PEMBAYARAN</span>
                  <span>{formatRp(printPreviewOrder.totalAmount)}</span>
                </div>
                <p className="text-[10px] text-center text-slate-400 italic">
                  *Struk pengujian MVP Haduyang Ratu Market. Simpan sebagai bukti transaksi.*
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setPrintPreviewOrder(null)} className="px-3 py-1.5 rounded-lg border font-sans text-xs font-bold">
                    Tutup
                  </button>
                  <button onClick={() => window.print()} className="px-4 py-1.5 rounded-lg bg-emerald-700 text-white font-sans text-xs font-bold flex items-center gap-1.5">
                    <Icon name="printer" className="w-3.5 h-3.5" /> Cetak
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* FLOATING QUICK ROLE-SWITCHER BAR (MANDATORY REQUIREMENT) */}
          {/* ======================================================== */}
          <aside className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-full max-w-xl px-4 pointer-events-none">
            <div className="bg-slate-900/95 backdrop-blur-md text-white rounded-2xl p-2 shadow-2xl border border-slate-700/60 pointer-events-auto flex items-center justify-between gap-1 sm:gap-2">
              
              <div className="flex items-center gap-1 sm:gap-2 flex-1">
                {/* Role 1: Pembeli */}
                <button
                  onClick={() => setRole('buyer')}
                  className={`flex-1 py-2 px-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                    role === 'buyer'
                      ? 'bg-emerald-600 text-white shadow-md'
                      : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <Icon name="user" className="w-4 h-4" />
                  <span className="hidden sm:inline">Pembeli:</span>
                  <span>Ibu Rina</span>
                </button>

                {/* Role 2: Penjual */}
                <button
                  onClick={() => setRole('seller')}
                  className={`flex-1 py-2 px-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                    role === 'seller'
                      ? 'bg-amber-600 text-white shadow-md'
                      : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <Icon name="store" className="w-4 h-4" />
                  <span className="hidden sm:inline">Penjual:</span>
                  <span>Pak Arif</span>
                </button>

                {/* Role 3: Admin */}
                <button
                  onClick={() => setRole('admin')}
                  className={`flex-1 py-2 px-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                    role === 'admin'
                      ? 'bg-blue-600 text-white shadow-md'
                      : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <Icon name="shield" className="w-4 h-4" />
                  <span className="hidden sm:inline">Admin:</span>
                  <span>BUMDes</span>
                </button>
              </div>

              {/* Reset Data Button */}
              <button
                onClick={handleResetData}
                title="Reset Data Uji ke Default"
                className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition"
              >
                <Icon name="refresh" className="w-4 h-4" />
              </button>
            </div>
          </aside>

        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
